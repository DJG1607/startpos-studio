name: Build Geode Mod

on:
  workflow_dispatch:
  push:
    branches: ["**"]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build
        id: build
        uses: geode-sdk/build-geode-mod@main
        with:
          sdk: given
          bindings-ref: 7f6c2a75742856de88dad354e576dcff8a28e881

      - uses: actions/upload-artifact@v4
        with:
          name: StartPosStudio
          path: ${{ steps.build.outputs.build-output }}/*.geode
